# Local development stack. Copy .env.example to .env and set your own local-only passwords first.
name: bezprocentu

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: bezprocentu
      POSTGRES_USER: bp_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD:?set COLLECTOR_DB_PASSWORD in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bp_owner -d bezprocentu"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # Applies EF Core migrations with the schema owner account, then exits.
  migrate:
    image: bezprocentu-collector:local
    build: { context: ./backend, target: collector }
    command: ["--migrate-only"]
    environment:
      ConnectionStrings__Default: Host=db;Database=bezprocentu;Username=bp_owner;Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrations: "true"
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]

  collector:
    image: bezprocentu-collector:local
    build: { context: ./backend, target: collector }
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=db;Database=bezprocentu;Username=bp_collector;Password=${COLLECTOR_DB_PASSWORD}
      Database__ApplyMigrations: "false"
      Collector__RefreshInterval: ${COLLECTOR_REFRESH_INTERVAL:-12:00:00}
      Collector__MaxPagesPerListing: ${COLLECTOR_MAX_PAGES_PER_LISTING:-10}
      Collector__MaxProductPagesPerRun: ${COLLECTOR_MAX_PRODUCT_PAGES:-1500}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, egress]

  api:
    image: bezprocentu-api:local
    build: { context: ./backend, target: api }
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=db;Database=bezprocentu;Username=bp_api;Password=${API_DB_PASSWORD}
      # All storefront traffic reaches the API from the single web container, so the per-IP limit is generous.
      RateLimit__PermitPerMinute: "1200"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  web:
    image: bezprocentu-web:local
    build: { context: ./frontend }
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      api: { condition: service_healthy }
    networks: [backend, frontend]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]
    networks: [frontend]

networks:
  # The database and API have no internet access and no published ports.
  backend:
    internal: true
  frontend: {}
  # Only the collector needs outbound HTTPS to the stores.
  egress: {}

volumes:
  db-data:
  caddy-data:
